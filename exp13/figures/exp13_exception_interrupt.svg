<polygon points="1240,585 1230.0950818741205,589.7846208752235 1230.0950818741205,580.2153791247765" fill="#49667f"/>
<text x="800" y="701" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle">级间异常总线：38 位 = 6 位异常标志 + 32 位 BADV / PC（指令 PC、valid 另行传递）</text>
<polyline points="1480,655 1480,830" fill="none" stroke="#49667f" stroke-width="2.3" stroke-linejoin="round"/>
<polygon points="1480,830 1475.2153791247765,820.0950818741205 1484.7846208752235,820.0950818741205" fill="#49667f"/>
