<rect x="1080" y="830" width="480" height="215" rx="12" fill="#f1f8f5" stroke="#37756b" stroke-width="2"/>
<text x="1100" y="869" fill="#37756b" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">CSR：保存与恢复状态</text>
<text x="1100" y="906" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">ERA ← 异常指令 PC；ESTAT ← 编码</text>
<text x="1100" y="938" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">ADEF / ALE：BADV ← 错误地址</text>
<text x="1100" y="970" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">PRMD ← 原 PLV、IE；CRMD 清零两域</text>
<text x="1100" y="1002" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">ertn：从 PRMD 恢复 PLV、IE</text>
<rect x="40" y="830" width="560" height="215" rx="12" fill="#fff8f0" stroke="#b06632" stroke-width="2"/>
<text x="60" y="869" fill="#b06632" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">WB 冲刷与取指重定向</text>
<text x="60" y="906" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">flush = wb_ex || ertn_flush</text>
<text x="60" y="938" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">flush_pc = 异常 ? EENTRY : ERA</text>
<text x="60" y="970" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">清各级 valid，禁止普通写回，取消除法</text>
<text x="60" y="1002" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">异常 / 返回重定向优先于分支和停顿</text>
