<text x="445" y="447" fill="#37756b" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">has_int</text>
<rect x="40" y="505" width="320" height="150" rx="12" fill="#f2f7fc" stroke="#3168a0" stroke-width="2"/>
<text x="60" y="544" fill="#3168a0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">ID：生成异常标志</text>
<text x="60" y="582" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">INT、ADEF、BRK、INE</text>
<text x="60" y="614" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">SYS 沿用 exp12</text>
<text x="60" y="646" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">初始地址字段 = 指令 PC</text>
<rect x="440" y="505" width="320" height="150" rx="12" fill="#f2f7fc" stroke="#3168a0" stroke-width="2"/>
<text x="460" y="544" fill="#3168a0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">EX：检查访存对齐</text>
<text x="460" y="582" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">字 / 半字不对齐 → ALE</text>
<text x="460" y="614" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">补入 ALE 和有效地址</text>
<text x="460" y="646" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">取消异常访存及写回</text>
<rect x="840" y="505" width="320" height="150" rx="12" fill="#f2f7fc" stroke="#3168a0" stroke-width="2"/>
<text x="860" y="544" fill="#3168a0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">MEM：传递异常信息</text>
<text x="860" y="582" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">标志、地址、PC 同步保存</text>
<text x="860" y="614" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">flush 当拍禁止 SRAM 访问</text>
<rect x="1240" y="505" width="320" height="150" rx="12" fill="#f2f7fc" stroke="#3168a0" stroke-width="2"/>
<text x="1260" y="544" fill="#3168a0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">WB：统一提交异常</text>
<text x="1260" y="582" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">valid &amp;&amp; |flags → wb_ex</text>
<text x="1260" y="614" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">按优先级生成 Ecode</text>
<text x="1260" y="646" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">异常优先于 ertn</text>
