<text x="840" y="902" fill="#37756b" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle">EENTRY / ERA</text>
<polyline points="40,945 15,945 15,350 40,350" fill="none" stroke="#b06632" stroke-width="2.3" stroke-linejoin="round"/>
<polygon points="40,350 30.095081874120552,354.78462087522354 30.095081874120552,345.21537912477646" fill="#b06632"/>
<text x="800" y="1102" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle">flags[5:0] = { INT, ADEF, ALE, SYS, BRK, INE }</text>
<text x="800" y="1141" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle">WB 编码优先级：INT &gt; ADEF &gt; ALE &gt; SYS &gt; BRK &gt; INE</text>
