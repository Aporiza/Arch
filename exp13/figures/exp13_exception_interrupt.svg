<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<rect width="100%" height="100%" fill="white"/>
<text x="800" y="54" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" text-anchor="middle">exp13 新增异常与中断处理结构</text>
<text x="800" y="90" fill="#687785" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">按当前源码 d012558 绘制 · 省略普通指令数据通路</text>
