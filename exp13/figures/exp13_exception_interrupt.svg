<text x="530" y="314" fill="#37756b" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">CSR：中断状态与屏蔽</text>
<text x="530" y="351" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">has_int = CRMD.IE &amp;&amp; |(ECFG.LIE &amp; IS)</text>
<text x="530" y="383" fill="#243447" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">定时器到期置位；TICLR 写 1 清除</text>
<rect x="40" y="300" width="340" height="100" rx="12" fill="#f2f7fc" stroke="#3168a0" stroke-width="2"/>
<text x="60" y="339" fill="#3168a0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="start">IF：取指请求检查</text>
